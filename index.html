<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ ¡Magia con Fourier! ✨</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f6f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        h1 {
            margin: 5px 0 10px 0;
            color: #2c3e50;
            font-size: 1.3rem;
            text-align: center;
        }

        /* BARRA DE CONTROLES */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 10px;
            width: 100%;
            max-width: 1100px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        label {
            font-weight: 600;
            color: #34495e;
            font-size: 0.9rem;
        }

        input[type="number"] {
            width: 60px;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            text-align: center;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-animate { background-color: #2ecc71; color: white; }
        .btn-stop { background-color: #e74c3c; color: white; }
        .btn-clear { background-color: #95a5a6; color: white; }

        /* CONTENEDOR DE PANELES (RESPONSIVO) */
        .panels-container {
            display: flex;
            flex-direction: column; /* Apilado por defecto en celulares */
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
        }

        /* Vista en Computadora / Tabletas Horizontales */
        @media (min-width: 768px) {
            .panels-container {
                flex-direction: row; /* Lado a lado 50% / 50% */
            }
        }

        .panel {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }

        .panel h2 {
            font-size: 0.95rem;
            margin: 0 0 8px 0;
            color: #475569;
            text-align: center;
        }

        /* ÁREA DE DIBUJO Y ANIMACIÓN */
        .canvas-wrapper {
            width: 100%;
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            background-color: #fafafa;
            width: 100%;
            height: 320px; /* Altura ideal móvil */
            display: block;
            touch-action: none; /* Bloquea el scroll del sistema en el lienzo */
        }

        @media (min-width: 768px) {
            canvas {
                height: 450px; /* Altura mayor en PC */
            }
        }
    </style>
</head>
<body>

    <h1>✨ ¡Magia con Círculos de Fourier! ✨</h1>

    <div class="controls">
        <div class="control-group">
            <label for="harmonics">Círculos:</label>
            <input type="number" id="harmonics" value="20" min="1" max="150">
        </div>
        <button class="btn-animate" onclick="startAnimation()">▶ Animar</button>
        <button class="btn-stop" onclick="stopAnimation()">⏹ Detener</button>
        <button class="btn-clear" onclick="clearCanvas()">🗑 Limpiar</button>
    </div>

    <div class="panels-container">
        <div class="panel">
            <h2>1. Dibuja aquí con tu dedo o ratón</h2>
            <div class="canvas-wrapper">
                <canvas id="drawCanvas"></canvas>
            </div>
        </div>
        <div class="panel">
            <h2>2. Mira la magia de los círculos</h2>
            <div class="canvas-wrapper">
                <canvas id="fourierCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const drawCanvas = document.getElementById('drawCanvas');
        const fourierCanvas = document.getElementById('fourierCanvas');
        const ctxDraw = drawCanvas.getContext('2d');
        const ctxFourier = fourierCanvas.getContext('2d');

        let isDrawing = false;
        let points = [];
        let animationFrameId = null;
        let fourierCoeffs = [];
        let reconstructedPath = [];
        let timeStep = 0;
        let numSamples = 300;

        // Ajustar resolución en píxeles reales del Canvas para evitar borrosidad y desalineación
        function resizeCanvas() {
            [drawCanvas, fourierCanvas].forEach(canvas => {
                const rect = canvas.getBoundingClientRect();
                if (canvas.width !== rect.width || canvas.height !== rect.height) {
                    canvas.width = rect.width;
                    canvas.height = rect.height;
                }
            });
            redrawOriginalPoints();
        }

        const resizeObserver = new ResizeObserver(() => resizeCanvas());
        resizeObserver.observe(drawCanvas.parentElement);

        function redrawOriginalPoints() {
            if (points.length < 2) return;
            ctxDraw.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            ctxDraw.beginPath();
            ctxDraw.lineWidth = 4;
            ctxDraw.lineCap = 'round';
            ctxDraw.lineJoin = 'round';
            ctxDraw.strokeStyle = '#8e44ad';
            ctxDraw.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctxDraw.lineTo(points[i].x, points[i].y);
            }
            ctxDraw.stroke();
        }

        // --- Eventos Táctiles y de Ratón Mejorados ---
        function getPos(e) {
            const rect = drawCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDraw(e) {
            stopAnimation();
            clearCanvas();
            isDrawing = true;
            const pos = getPos(e);
            points.push(pos);
            ctxDraw.beginPath();
            ctxDraw.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            points.push(pos);
            ctxDraw.lineWidth = 4;
            ctxDraw.lineCap = 'round';
            ctxDraw.lineJoin = 'round';
            ctxDraw.strokeStyle = '#8e44ad';
            ctxDraw.lineTo(pos.x, pos.y);
            ctxDraw.stroke();
        }

        function stopDraw() {
            isDrawing = false;
        }

        // Eventos Ratón
        drawCanvas.addEventListener('mousedown', startDraw);
        drawCanvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDraw);

        // Eventos Táctiles (Con prevención estricta de Scroll)
        drawCanvas.addEventListener('touchstart', (e) => {
            if (e.target === drawCanvas) e.preventDefault();
            startDraw(e);
        }, { passive: false });

        drawCanvas.addEventListener('touchmove', (e) => {
            if (e.target === drawCanvas) e.preventDefault();
            draw(e);
        }, { passive: false });

        drawCanvas.addEventListener('touchend', (e) => {
            stopDraw();
        });

        // --- Cálculo de Fourier (DFT) ---
        function computeFourier() {
            if (points.length < 10) return false;

            let x = points.map(p => p.x);
            let y = points.map(p => p.y);

            let meanX = x.reduce((a, b) => a + b) / x.length;
            let meanY = y.reduce((a, b) => a + b) / y.length;

            let z = [];
            for (let i = 0; i < points.length; i++) {
                z.push({ re: points[i].x - meanX, im: points[i].y - meanY });
            }

            let samples = [];
            for (let i = 0; i < numSamples; i++) {
                let idx = Math.floor((i / numSamples) * z.length);
                samples.push(z[idx]);
            }

            let X = [];
            const N = samples.length;

            for (let k = 0; k < N; k++) {
                let re = 0;
                let im = 0;
                for (let n = 0; n < N; n++) {
                    let phi = (2 * Math.PI * k * n) / N;
                    re += samples[n].re * Math.cos(phi) + samples[n].im * Math.sin(phi);
                    im += -samples[n].re * Math.sin(phi) + samples[n].im * Math.cos(phi);
                }
                re /= N;
                im /= N;

                let freq = k;
                let amp = Math.sqrt(re * re + im * im);
                let phase = Math.atan2(im, re);

                X.push({ re, im, freq, amp, phase });
            }

            X.sort((a, b) => b.amp - a.amp);

            let harmonics = parseInt(document.getElementById('harmonics').value) || 20;
            fourierCoeffs = X.slice(0, Math.min(harmonics, N));
            return true;
        }

        // --- Animación de los Círculos ---
        function startAnimation() {
            if (!computeFourier()) {
                alert("Dibuja una figura con el dedo antes de animar.");
                return;
            }
            stopAnimation();
            reconstructedPath = [];
            timeStep = 0;
            animate();
        }

        function animate() {
            ctxFourier.clearRect(0, 0, fourierCanvas.width, fourierCanvas.height);

            let x = fourierCanvas.width / 2;
            let y = fourierCanvas.height / 2;

            const dt = (2 * Math.PI) / numSamples;
            const time = timeStep * dt;

            for (let i = 0; i < fourierCoeffs.length; i++) {
                let prevX = x;
                let prevY = y;

                let radius = fourierCoeffs[i].amp;
                let freq = fourierCoeffs[i].freq;
                let phase = fourierCoeffs[i].phase;

                x += radius * Math.cos(freq * time + phase);
                y += radius * Math.sin(freq * time + phase);

                // Dibujar círculo
                ctxFourier.beginPath();
                ctxFourier.arc(prevX, prevY, radius, 0, 2 * Math.PI);
                ctxFourier.strokeStyle = 'rgba(52, 152, 219, 0.35)';
                ctxFourier.lineWidth = 1;
                ctxFourier.stroke();

                // Dibujar línea / radio
                ctxFourier.beginPath();
                ctxFourier.moveTo(prevX, prevY);
                ctxFourier.lineTo(x, y);
                ctxFourier.strokeStyle = 'rgba(231, 76, 60, 0.7)';
                ctxFourier.lineWidth = 1.5;
                ctxFourier.stroke();
            }

            reconstructedPath.unshift({ x, y });
            if (reconstructedPath.length > numSamples) reconstructedPath.pop();

            // Dibujar trazo verde reconstruido
            ctxFourier.beginPath();
            ctxFourier.strokeStyle = '#2ecc71';
            ctxFourier.lineWidth = 3;
            for (let i = 0; i < reconstructedPath.length - 1; i++) {
                ctxFourier.moveTo(reconstructedPath[i].x, reconstructedPath[i].y);
                ctxFourier.lineTo(reconstructedPath[i + 1].x, reconstructedPath[i + 1].y);
            }
            ctxFourier.stroke();

            timeStep++;
            animationFrameId = requestAnimationFrame(animate);
        }

        function stopAnimation() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }

        function clearCanvas() {
            stopAnimation();
            points = [];
            reconstructedPath = [];
            ctxDraw.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            ctxFourier.clearRect(0, 0, fourierCanvas.width, fourierCanvas.height);
        }
    </script>
</body>
</html>
